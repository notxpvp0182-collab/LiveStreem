name: Build Batch 4 (26.1 - 26.3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.1"
            loader: "0.19.5"
            fabric: "0.145.1+26.1"
          - mc: "26.1.1"
            loader: "0.19.5"
            fabric: "0.145.4+26.1.1"
          - mc: "26.1.2"
            loader: "0.19.5"
            fabric: "0.155.3+26.1.2"
          - mc: "26.2"
            loader: "0.19.5"
            fabric: "0.158.0+26.2"
          - mc: "26.3"
            loader: "0.20.1"
            fabric: "0.163.0+26.3"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Configure Version ${{ matrix.mc }} via sed
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=${{ matrix.loader }}/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=${{ matrix.fabric }}/" gradle.properties
          sed -i "s/^mod_version=.*/mod_version=${{ matrix.mc }}/" gradle.properties
          sed -i 's/"minecraft": "[^"]*"/"minecraft": "${{ matrix.mc }}"/' src/main/resources/fabric.mod.json

          if [[ "${{ matrix.mc }}" == "26.2" || "${{ matrix.mc }}" == "26.3" ]]; then
            find src/main/java -name "*.java" -exec sed -i \
              -e 's/client\.screen/client.gui.screen()/g' \
              -e 's/mc\.screen/mc.gui.screen()/g' \
              -e 's/\.getInstance()\.screen/.getInstance().gui.screen()/g' \
              -e 's/client\.setScreen(/client.gui.setScreen(/g' \
              -e 's/this\.minecraft\.setScreen(/this.minecraft.gui.setScreen(/g' {} +
          fi
          if [[ "${{ matrix.mc }}" == "26.3" ]]; then
            sed -i 's/InputConstants\.Type\.KEYSYM/InputConstants.Type.KEYBOARD/g' src/main/java/dev/ahmed/liquidglass/LiquidGlassClient.java
          fi

      - name: Build Mod for ${{ matrix.mc }}
        run: gradle build --no-daemon

      - name: Upload Artifact for ${{ matrix.mc }}
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/LiveStream-${{ matrix.mc }}.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Strip All Source Code from Public Branch and Release Tag
        run: |
          cp README.md /tmp/README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan readme-only
          git rm -rf .
          cp /tmp/README.md README.md
          git add README.md
          git commit -m "LiveStream Official Release Hub (README Only)"
          git tag -f all-versions
          git push origin refs/tags/all-versions --force

      - name: Download All Built Jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish All Jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: all-versions
          name: "LiveStream Mod (All Versions 1.21 - 26.3)"
          body_path: README.md
          files: dist/LiveStream-*.jar
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
