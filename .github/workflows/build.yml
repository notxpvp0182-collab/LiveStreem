name: Build Batch 3 (1.21.9 - 1.21.11)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.9"
            yarn: "1.21.9+build.1"
            loader: "0.18.1"
            fabric: "0.134.0+1.21.9"
          - mc: "1.21.10"
            yarn: "1.21.10+build.2"
            loader: "0.18.1"
            fabric: "0.138.0+1.21.10"
          - mc: "1.21.11"
            yarn: "1.21.11+build.6"
            loader: "0.18.1"
            fabric: "0.141.1+1.21.11"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Configure Version ${{ matrix.mc }} via sed
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          sed -i "s/^yarn_mappings=.*/yarn_mappings=${{ matrix.yarn }}/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=${{ matrix.loader }}/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=${{ matrix.fabric }}/" gradle.properties
          sed -i "s/^mod_version=.*/mod_version=${{ matrix.mc }}/" gradle.properties
          sed -i 's/"minecraft": "[^"]*"/"minecraft": "${{ matrix.mc }}"/' src/main/resources/fabric.mod.json

      - name: Build Mod for ${{ matrix.mc }}
        run: gradle build --no-daemon

      - name: Upload Artifact for ${{ matrix.mc }}
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/LiveStream-${{ matrix.mc }}.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Source Code from Release Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # পুরনো v1.21 রিলিজ ও ট্যাগ ডিলিট করা (যেটাতে সোর্স কোড ছিল)
          gh release delete v1.21 --yes --cleanup-tag || true
          # শুধুমাত্র README.md দিয়ে একটি সোর্স-কোডহীন কমিট বানিয়ে রিলিজ ট্যাগে পুশ করা
          cp README.md /tmp/README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan readme-only-tag
          git rm -rf .
          cp /tmp/README.md README.md
          git add README.md
          git commit -m "Release README only (No Source Code)"
          git tag -f all-versions
          git push origin refs/tags/all-versions --force

      - name: Download All Built Jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish All Jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: all-versions
          name: "LiveStream Mod (All Versions 1.21 - 26.3)"
          files: dist/LiveStream-*.jar
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
