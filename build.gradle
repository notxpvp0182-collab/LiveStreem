import java.awt.*
import java.awt.geom.*
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.findProperty("release_version") ?: project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.named("processResources") {
    inputs.property "version", project.version

    doFirst {
        System.setProperty("java.awt.headless", "true")
        File iconFile = file("src/main/resources/assets/liquidglass/icon.png")
        iconFile.parentFile.mkdirs()
        int size = 128
        BufferedImage img = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
        Graphics2D g = img.createGraphics()
        g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)

        // Dark liquid glass background
        g.setColor(new Color(10, 12, 18, 250))
        g.fill(new RoundRectangle2D.Float(4, 4, size - 8, size - 8, 30, 30))

        // Frosted specular rim
        g.setStroke(new BasicStroke(3.0f))
        g.setColor(new Color(216, 222, 233, 95))
        g.draw(new RoundRectangle2D.Float(5.5f, 5.5f, size - 11, size - 11, 28, 28))

        // Outer red LIVE pulse glow
        g.setColor(new Color(252, 92, 101, 65))
        g.fill(new Ellipse2D.Float(24, 24, 80, 80))

        // Inner red LIVE badge
        g.setColor(new Color(235, 59, 90, 255))
        g.fill(new Ellipse2D.Float(34, 34, 60, 60))

        // White Play Triangle
        int[] px = [55, 55, 79] as int[]
        int[] py = [47, 81, 64] as int[]
        g.setColor(Color.WHITE)
        g.fillPolygon(px, py, 3)
        g.dispose()

        ImageIO.write(img, "PNG", iconFile)
    }

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
