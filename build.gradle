import java.awt.*
import java.awt.geom.*
import java.awt.image.BufferedImage
import java.io.DataOutputStream
import java.io.FileOutputStream
import javax.imageio.ImageIO

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.findProperty("release_version") ?: project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.named("processResources") {
    inputs.property "version", project.version

    doFirst {
        System.setProperty("java.awt.headless", "true")

        // 1. Generate 256x256 YouTube LiveStream Mod Icon
        File iconFile = file("src/main/resources/assets/liquidglass/icon.png")
        iconFile.parentFile.mkdirs()
        int s = 256
        BufferedImage img = new BufferedImage(s, s, BufferedImage.TYPE_INT_ARGB)
        Graphics2D g = img.createGraphics()
        g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)

        GradientPaint bgGrad = new GradientPaint(0, 0, new Color(18, 20, 28, 255), 0, s, new Color(8, 9, 13, 255))
        g.setPaint(bgGrad)
        g.fill(new RoundRectangle2D.Float(8, 8, s - 16, s - 16, 60, 60))

        g.setStroke(new BasicStroke(4.0f))
        g.setColor(new Color(255, 255, 255, 45))
        g.draw(new RoundRectangle2D.Float(10, 10, s - 20, s - 20, 56, 56))

        g.setColor(new Color(255, 0, 51, 55))
        g.fill(new RoundRectangle2D.Float(34, 62, 188, 132, 56, 56))

        GradientPaint ytGrad = new GradientPaint(0, 70, new Color(255, 20, 60, 255), 0, 186, new Color(210, 0, 38, 255))
        g.setPaint(ytGrad)
        g.fill(new RoundRectangle2D.Float(44, 72, 168, 112, 44, 44))

        int[] px = [110, 110, 158] as int[]
        int[] py = [100, 156, 128] as int[]
        g.setColor(Color.WHITE)
        g.fillPolygon(px, py, 3)

        g.setColor(new Color(255, 59, 92, 255))
        g.fill(new Ellipse2D.Float(192, 34, 24, 24))
        g.setColor(Color.WHITE)
        g.fill(new Ellipse2D.Float(199, 41, 10, 10))
        g.dispose()
        ImageIO.write(img, "PNG", iconFile)

        // 2. Pre-bake Full HD 2D-Merged Bengali Akshar Atlas from HindSiliguri-SemiBold.ttf
        File ttfFile = file("src/main/resources/assets/liquidglass/font/bengali.ttf")
        File atlasFile = file("src/main/resources/assets/liquidglass/font/bengali_atlas.dat")
        if (ttfFile.exists()) {
            Font bnFont = Font.createFont(Font.TRUETYPE_FONT, ttfFile).deriveFont(Font.BOLD, 28.0f)
            java.util.Set<String> akshars = new java.util.LinkedHashSet<>()

            String[] vowelsAndDigits = [
                "অ","আ","ই","ঈ","উ","ঊ","ঋ","এ","ঐ","ও","ঔ",
                "০","১","২","৩","৪","৫","৬","৭","৮","৯","।",
                "া","ি","ী","ু","ূ","ৃ","ে","ৈ","ো","ৌ","ং","ঃ","ঁ","্","ৎ"
            ]
            akshars.addAll(java.util.Arrays.asList(vowelsAndDigits))

            String[] consonants = [
                "ক","খ","গ","ঘ","ঙ","চ","ছ","জ","ঝ","ঞ",
                "ট","ঠ","ড","ঢ","ণ","ত","থ","দ","ধ","ন",
                "প","ফ","ব","ভ","ম","য","র","ল","শ","ষ",
                "স","হ","ড়","ঢ়","য়"
            ]
            String[] suffixes = [
                "","া","ি","ী","ু","ূ","ৃ","ে","ৈ","ো","ৌ",
                "ং","ঁ","াং","াঁ","িং","ীং","েং","োং",
                "্র","্রা","্রি","্রী","্রু","্রে","্রো",
                "্য","্যা","্যি","্যে","্যো","্"
            ]
            for (String c : consonants) {
                for (String suf : suffixes) {
                    akshars.add(c + suf)
                    akshars.add("র্" + c + suf)
                }
            }

            String[] conjuncts = [
                "ক্ক","ক্ত","ক্স","ক্ষ","ক্ষ্ম","গ্ধ","গ্ন","গ্র","ঙ্ক","ঙ্গ",
                "চ্চ","চ্ছ","চ্ছ্ব","জ্ঞ","ঞ্চ","ঞ্জ","ট্ট","ড্ড","ণ্ট","ণ্ড",
                "ত্ত","ত্থ","ত্ন","ত্ম","ত্র","দ্গ","দ্ধ","দ্দ","দ্ব","দ্ভ",
                "ধ্র","ন্ট","ন্ড","ন্ত","ন্তু","ন্থ","ন্দ","ন্ধ","ন্ন","ন্ম",
                "ন্স","প্ত","প্প","প্র","প্ল","ব্জ","ব্দ","ব্ধ","ব্ব","ব্র",
                "ভ্র","ম্প","ম্ফ","ম্ব","ম্ভ","ম্ম","ল্ক","ল্গ","ল্ট","ল্ড",
                "ল্প","ল্ল","শ্চ","শ্ন","শ্ম","শ্য","শ্র","ষ্ক","ষ্ট","ষ্ঠ",
                "ষ্ণ","ষ্প","স্ক","স্ট","স্ন","স্প","স্ফ","স্ব","স্ম","স্য",
                "স্র","হ্ন","হ্ম","হ্র","র্ল্ড","্র","্য"
            ]
            String[] conjSuffixes = ["","া","ি","ী","ু","ূ","ৃ","ে","ৈ","ো","ৌ","ং","ঁ","্য","্র"]
            for (String cj : conjuncts) {
                for (String suf : conjSuffixes) {
                    akshars.add(cj + suf)
                    akshars.add("র্" + cj + suf)
                }
            }

            BufferedImage canvas = new BufferedImage(112, 42, BufferedImage.TYPE_INT_ARGB)
            Graphics2D cg = canvas.createGraphics()
            cg.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
            cg.setRenderingHint(RenderingHints.KEY_FRACTIONALMETRICS, RenderingHints.VALUE_FRACTIONALMETRICS_ON)
            cg.setFont(bnFont)
            FontMetrics fm = cg.getFontMetrics()

            atlasFile.parentFile.mkdirs()
            try (DataOutputStream out = new DataOutputStream(new FileOutputStream(atlasFile))) {
                out.writeInt(akshars.size())
                for (String ak : akshars) {
                    cg.setComposite(AlphaComposite.Clear)
                    cg.fillRect(0, 0, 112, 42)
                    cg.setComposite(AlphaComposite.SrcOver)
                    cg.setColor(Color.WHITE)
                    cg.drawString(ak, 4, 29)

                    int adv = Math.max(4, fm.stringWidth(ak))
                    java.util.List<int[]> rawSpans = new java.util.ArrayList<>()
                    for (int y = 0; y < 40; y++) {
                        int x = 0
                        while (x < 108) {
                            int a = (canvas.getRGB(x, y) >>> 24) & 0xFF
                            if (a >= 65) {
                                int xStart = x
                                int sumA = a
                                int cnt = 1
                                x++
                                while (x < 108) {
                                    int na = (canvas.getRGB(x, y) >>> 24) & 0xFF
                                    if (na < 65) break
                                    sumA += na
                                    cnt++
                                    x++
                                }
                                int avgA = Math.min(255, (int) ((sumA / cnt) * 1.15f))
                                rawSpans.add([y, y + 1, xStart, x, avgA] as int[])
                            } else {
                                x++
                            }
                        }
                    }

                    // Vertically merge adjacent rows that have identical xStart and xEnd
                    java.util.List<Integer> mergedRects = new java.util.ArrayList<>()
                    boolean[] used = new boolean[rawSpans.size()]
                    for (int i = 0; i < rawSpans.size(); i++) {
                        if (used[i]) continue
                        int[] cur = rawSpans.get(i)
                        int y1 = cur[0], y2 = cur[1], x1 = cur[2], x2 = cur[3], aSum = cur[4], aCnt = 1
                        for (int j = i + 1; j < rawSpans.size(); j++) {
                            if (used[j]) continue
                            int[] nxt = rawSpans.get(j)
                            if (nxt[0] == y2 && nxt[2] == x1 && nxt[3] == x2) {
                                y2 = nxt[1]
                                aSum += nxt[4]
                                aCnt++
                                used[j] = true
                            }
                        }
                        int finalA = Math.min(63, ((int) (aSum / aCnt)) >> 2)
                        int packed = ((y1 & 0x3F) << 26) | ((y2 & 0x3F) << 20) | ((x1 & 0x7F) << 13) | ((x2 & 0x7F) << 6) | finalA
                        mergedRects.add(packed)
                    }

                    out.writeUTF(ak)
                    out.writeByte(adv)
                    out.writeShort(mergedRects.size())
                    for (int sp : mergedRects) {
                        out.writeInt(sp)
                    }
                }
            }
            cg.dispose()
        }
    }

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
